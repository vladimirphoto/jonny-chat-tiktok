name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: EchoChat-LIVE-exe
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Релиз с exe создаётся автоматически для версии из package.json —
      # именно его скачивает кнопка «Проверить обновления» в приложении.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: ЭхоЧат LIVE ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
