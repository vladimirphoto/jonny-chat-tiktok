name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist

      # Автотест собранного приложения: открывает окно, нажимает кнопки,
      # синтезирует голоса, проверяет подключение к несуществующему эфиру.
      - name: Self-test packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1
          Write-Host "Testing $($exe.FullName)"
          $out = Join-Path $PWD 'selftest.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest',"--out=$out" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'TIMEOUT: app did not finish' }
          if (Test-Path $out) {
            $r = Get-Content $out -Raw | ConvertFrom-Json
            Write-Host "=== SELFTEST v$($r.version) electron $($r.electron) ==="
            foreach ($t in $r.results) {
              $mark = if ($t.ok) { 'PASS' } else { 'FAIL' }
              Write-Host ("[{0}] [{1}] {2} :: {3}" -f $mark, $t.group, $t.name, $t.detail)
            }
            Write-Host "critical failed: $($r.criticalFailed)"
            if ($r.criticalFailed -gt 0) { exit 1 }
          } else {
            Write-Host 'no result file - app failed to start'
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: EchoChat-LIVE-exe
          path: dist/*.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: ЭхоЧат LIVE ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
