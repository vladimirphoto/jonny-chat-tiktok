<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Новые топ лайки</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;height:100%;color:#fff}
#root{position:fixed;inset:0;display:flex;flex-direction:column;padding:14px 18px;box-sizing:border-box}
#board{width:344px;display:flex;flex-direction:column;gap:10px;align-self:center;zoom:1}
body.pv #root{justify-content:center;padding:10px}
#ttl{align-self:flex-start;display:flex;align-items:center;gap:7px;padding:5px 14px 5px 10px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.14em;background:linear-gradient(90deg,rgba(70,34,120,.95),rgba(36,18,70,.95));border:1.5px solid rgba(190,150,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.35);margin-left:14px;margin-bottom:14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
#ttl img{width:22px;height:21px;animation:bob 2.6s ease-in-out infinite}
body.notitle #ttl{display:none}body.notitle #rows{padding-top:22px}
#rows{position:relative;display:flex;flex-direction:column;gap:9px}
.row{position:relative;display:flex;align-items:center;height:56px;padding:0 18px 0 8px;box-sizing:border-box}.row.nw{animation:rin .5s cubic-bezier(.2,1.2,.4,1) both}
.pl{position:absolute;inset:0;border-radius:999px;overflow:hidden;background:linear-gradient(90deg,rgba(78,36,134,.94),rgba(34,16,64,.94));border:2px solid rgba(196,160,255,.5);box-shadow:0 5px 16px rgba(0,0,0,.4)}
.pl::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.04) 34%,rgba(255,255,255,.14) 42%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.14) 58%,rgba(255,255,255,.04) 66%,transparent 78%);background-size:320% 100%;background-position:150% 0;animation:shine 19s cubic-bezier(.4,0,.6,1) infinite;animation-delay:calc(var(--i,0)*1.4s);mix-blend-mode:screen;pointer-events:none}
body.nobg .pl{display:none}
.r1 .pl{background:linear-gradient(90deg,#8a5a10,#c8901f 40%,#4a2a82);border-color:#ffd25a;box-shadow:0 0 18px rgba(255,200,70,.55),0 5px 16px rgba(0,0,0,.4)}
.r2 .pl{background:linear-gradient(90deg,#6c7088,#9aa0bb 40%,#3a2a66);border-color:#dfe3f5}
.r3 .pl{background:linear-gradient(90deg,#7a4426,#b26b3c 40%,#3a2a66);border-color:#e3a070}
.rk{position:relative;z-index:1;flex:none;width:44px;height:46px;margin-right:6px}
.rk img.m{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.rk b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:900;color:#fff;-webkit-text-stroke:3px rgba(60,25,10,.75);paint-order:stroke fill;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cw{position:absolute;left:-9px;top:-17px;width:34px;height:auto;z-index:3;transform:rotate(-16deg);transform-origin:50% 90%;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));display:none}
.r1 .cw{display:block}
.sk{position:absolute;width:13px;height:auto;z-index:4;pointer-events:none;animation:tw 2.2s ease-in-out infinite;display:none}
.r1 .sk{display:block}.sk.a{left:20px;top:-18px}.sk.b{left:-12px;top:-4px;animation-delay:.9s;width:10px}
.av{position:relative;z-index:1;flex:none;width:44px;height:44px;margin:0 12px 0 4px}
.av i{position:absolute;inset:0;border-radius:50%;background:#4b5563 center/cover no-repeat;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;overflow:hidden}
.av img.f{position:absolute;left:-7px;top:-7px;width:58px;height:58px;display:none;pointer-events:none}
.r1 .av img.f,.r2 .av img.f,.r3 .av img.f{display:block}
.r1 .av::before{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 16px 3px rgba(255,205,80,.8);animation:glow 2.4s ease-in-out infinite}
.tx{position:relative;z-index:1;min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1.1;text-shadow:0 2px 5px rgba(0,0,0,.65)}
.nm{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;max-width:100%;min-width:0}
.nm .nt{display:inline-block;will-change:transform}
.nm.mq{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.nm.mq .nt{animation:mq var(--t,6s) ease-in-out infinite}
@keyframes mq{0%,22%{transform:translateX(0)}50%,72%{transform:translateX(calc(-1px*var(--d,0) - 6px))}100%{transform:translateX(0)}}
.lk{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:800;color:#ff9bc6;margin-top:3px}
.lk img{width:16px;height:auto}
.lk img{transform-origin:50% 55%}.row.up .lk img{animation:beat .7s ease-in-out}.row.up .lk span{animation:bump .7s ease-out;transform-origin:0 50%;display:inline-block}
/* Spotlight: большая стеклянная плашка для первого места, остальные тонкие */
.d-spotlight .row{height:42px}.d-spotlight .rk{width:34px;height:36px}.d-spotlight .rk b{font-size:16px}.d-spotlight .av{width:34px;height:34px;margin-right:10px}.d-spotlight .av img.f{display:none!important}
.d-spotlight .nm{font-size:15px}.d-spotlight .lk{font-size:13px;margin-top:1px}.d-spotlight .lk img{width:13px}
.d-spotlight .r1{height:92px;padding-left:12px}.d-spotlight .r1 .rk{width:64px;height:68px}.d-spotlight .r1 .rk b{font-size:30px}.d-spotlight .r1 .av{width:70px;height:70px}.d-spotlight .r1 .av img.f{display:block!important;left:-9px;top:-9px;width:88px;height:88px}
.d-spotlight .r1 .nm{font-size:24px}.d-spotlight .r1 .lk{font-size:19px}.d-spotlight .r1 .lk img{width:20px}.d-spotlight .r1 .cw{left:-8px;top:-24px;width:46px}
.d-spotlight .r1 .pl{border-radius:30px;background:linear-gradient(135deg,#a8741a,#e8b53a 35%,#7a4ac0 100%)}
.d-spotlight .pl{border-radius:999px}
/* Sticker: наклейки с белой обводкой и жирными цифрами */
.d-sticker .pl{background:linear-gradient(90deg,#7c4dff,#c04dff);border:4px solid #fff;box-shadow:0 0 0 3px #1b1033,5px 7px 0 rgba(0,0,0,.45);border-radius:22px}
.d-sticker .r1 .pl{background:linear-gradient(90deg,#ffb020,#ff6a3d)}.d-sticker .r2 .pl{background:linear-gradient(90deg,#44c7ff,#5b7cff)}.d-sticker .r3 .pl{background:linear-gradient(90deg,#ff5fa2,#ff8a5b)}
.d-sticker .row:nth-child(odd){transform:rotate(-1.2deg)}.d-sticker .row:nth-child(even){transform:rotate(1deg)}
.d-sticker .rk b{font-size:26px;-webkit-text-stroke:5px #1b1033}
.d-sticker .nm,.d-sticker .lk{-webkit-text-stroke:4px #1b1033;paint-order:stroke fill;text-shadow:none}
.d-sticker .lk{color:#fff}.d-sticker .rk img.m{display:none}.d-sticker .rk{width:34px}.d-sticker .cw{left:-12px}
.d-sticker .av i{border:3px solid #fff;box-sizing:border-box}.d-sticker .av img.f{display:none!important}
/* Flowery: нежные пастельные цвета и цветочки */
.d-flowery .pl{background:linear-gradient(90deg,#ffe0ee,#fff3f8);border:2px solid #ffb6d5;box-shadow:0 4px 14px rgba(255,150,190,.35)}
.d-flowery .r1 .pl{background:linear-gradient(90deg,#ffd8a8,#fff0d6);border-color:#ffc06a}.d-flowery .r2 .pl{background:linear-gradient(90deg,#e0d4ff,#f3eeff);border-color:#c3a8ff}.d-flowery .r3 .pl{background:linear-gradient(90deg,#cdeedd,#eefaf3);border-color:#93d9b4}
.d-flowery .pl::before{content:"";position:absolute;right:10px;top:50%;width:34px;height:34px;margin-top:-17px;opacity:.9;background:var(--fl) center/contain no-repeat}
.d-flowery .nm{color:#6b2b57;text-shadow:none}.d-flowery .lk{color:#e0407f;text-shadow:none}.d-flowery .tx{text-shadow:none}
.d-flowery .tx{padding-right:54px;box-sizing:border-box}.d-flowery .nm{text-overflow:ellipsis} /* ник короче: не заходит под цветок справа */
.d-flowery .rk img.m{filter:hue-rotate(-8deg) saturate(.9) drop-shadow(0 2px 3px rgba(150,60,100,.35))}
.d-flowery #ttl{background:linear-gradient(90deg,#ffc2dc,#ffe3ef);border-color:#ff9fc6;color:#8a2c5c}
body.nobg.d-flowery .nm,body.nobg .d-flowery .nm{color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.65)}

/* ===== Spotlight: точно как на референсе ===== */
#board.d-spotlight{width:292px;gap:4px}
.d-spotlight #ttl{margin-left:8px;margin-bottom:20px;padding:4px 12px 4px 8px;font-size:12px;letter-spacing:.12em;gap:6px}
.d-spotlight #ttl img{width:22px;height:auto}
body.nobg .d-spotlight #ttl{background:none;border:0;box-shadow:none}
.d-spotlight #rows{gap:7px}
.d-spotlight .row{height:38px;padding:0 14px 0 5px}
.d-spotlight .pl{background:linear-gradient(90deg,rgba(54,28,98,.96),rgba(30,16,60,.96));border:2px solid rgba(176,138,240,.5);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.d-spotlight .r2 .pl{border-color:rgba(214,219,240,.55)}.d-spotlight .r3 .pl{border-color:rgba(225,160,112,.6)}
.d-spotlight .rk{width:32px;height:30px;margin-right:5px}
.d-spotlight .rk img.m{object-fit:contain}
.d-spotlight .rk b{font-size:14px;line-height:1;padding-top:2px;box-sizing:border-box;font-variant-numeric:tabular-nums;-webkit-text-stroke:2.5px rgba(150,10,70,.85);paint-order:stroke fill}
.d-spotlight .av{width:30px;height:30px;margin:0 9px 0 1px}
.d-spotlight .av i{font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.d-spotlight .tx{flex:1;flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
.d-spotlight .nm{font-size:13.5px;max-width:none;flex:1;min-width:0}
.d-spotlight .lk{font-size:13px;margin:0;color:#ff7db4;flex:none;gap:4px}.d-spotlight .lk img{width:14px}
/* 1 место: жёлтая плашка с лучами-солнышком */
.d-spotlight .r1{height:76px;padding:0 14px 0 10px;margin-top:2px}
.d-spotlight .r1 .rk{display:none}
.d-spotlight .r1 .pl{border-radius:26px;border:2.5px solid rgba(255,248,206,.95);background:linear-gradient(180deg,#fff08a 0%,#ffd91f 52%,#ffb300 100%);box-shadow:0 0 22px rgba(255,205,40,.7),0 5px 14px rgba(0,0,0,.4),inset 0 2px 6px rgba(255,255,255,.55)}
.d-spotlight .r1 .pl::before{content:"";position:absolute;left:-123px;top:50%;width:320px;height:320px;margin-top:-160px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.3) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 68%);mask-image:radial-gradient(circle,#000 8%,transparent 68%);animation:sun 22s linear infinite,sunp 3.2s ease-in-out infinite;pointer-events:none}
.d-spotlight .r1 .av{width:56px;height:56px;margin:0 12px 0 4px}
.d-spotlight .r1 .av i{font-size:24px}
.d-spotlight .r1 .av img.f{display:block!important;left:-6px;top:-6px;width:68px;height:68px}
.d-spotlight .r1 .av::before{inset:-12px;box-shadow:none;background:radial-gradient(circle,rgba(255,244,190,.85) 0,rgba(255,220,120,.4) 45%,transparent 70%);animation:glow 2.8s ease-in-out infinite}
.d-spotlight .r1 .tx{flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.d-spotlight .r1 .nm{font-size:17px;max-width:170px;color:#fff;-webkit-text-stroke:3px rgba(122,62,0,.9);paint-order:stroke fill}
.d-spotlight .r1 .lk{font-size:24px;margin-top:1px;color:#fff;gap:6px;-webkit-text-stroke:3.5px rgba(122,62,0,.9);paint-order:stroke fill}.d-spotlight .r1 .lk img{width:24px}
.d-spotlight .r1 .cw{left:-6px;top:-21px;width:38px}
.d-spotlight .r1 .sk.a{left:78px;top:6px;width:11px}.d-spotlight .r1 .sk.b{left:2px;top:-6px}
/* без фона: плашки 2–5 пропадают, жёлтый блок 1 места остаётся */
body.nobg .d-spotlight .r1 .pl{display:block}
@keyframes rin{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:150% 0}55%,100%{background-position:-50% 0}}@keyframes sun{to{transform:rotate(360deg)}}@keyframes sunp{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes bob{0%,100%{transform:rotate(-16deg) translateY(0)}50%{transform:rotate(-12deg) translateY(-3px)}}
#ttl img{animation-name:tbob}@keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes beat{0%{transform:scale(1)}22%{transform:scale(1.28)}44%{transform:scale(1.05)}64%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.nm.mq .nt,.pl::after,.cw,.sk,.r1 .av::before{animation:none!important}}
</style></head><body>

// предпросмотр в приложении: всегда по центру окошка; чем больше строк, тем мельче (масштаб считаем по реальному размеру)
function fitSelf(){
  if(!BOX)return;
  document.body.classList.add('pv');
  board.style.zoom=1;
  var bw=board.offsetWidth+36,bh=board.offsetHeight+44,k=Math.min(1.5,.96*BOX.w/bw,.96*BOX.h/bh);
  PK=Math.max(.15,k);board.style.zoom=PK;
}
function setNm(el,nm){var t=el.firstChild;if(!t||t.className!=='nt'){el.textContent='';t=document.createElement('span');t.className='nt';el.appendChild(t);}if(t.textContent!==nm){t.textContent=nm;el.dataset.m='';}}
function marquee(){for(var k in MAP){var el=MAP[k].querySelector('.nm'),t=el&&el.firstChild;if(!t)continue;var d=Math.ceil(t.offsetWidth-el.clientWidth),key=d+'|'+el.clientWidth;if(el.dataset.m===key)continue;el.dataset.m=key;if(d>2){el.style.setProperty('--d',d);el.style.setProperty('--t',(4+d/22).toFixed(1)+'s');el.classList.add('mq');}else{el.classList.remove('mq');}}}
function mk(){
  var r=document.createElement('div');r.className='row nw';
  r.innerHTML='<div class="pl"></div><img class="cw" alt=""><img class="sk a" alt=""><img class="sk b" alt=""><div class="rk"><img class="m" alt=""><b></b></div><div class="av"><i></i><img class="f" alt=""></div><div class="tx"><span class="nm"></span><span class="lk"><img alt=""><span></span></span></div>';
  r.querySelector('.cw').src=IMG.ch;r.querySelectorAll('.sk').forEach(function(x){x.src=IMG.sp;});r.querySelector('.lk img').src=IMG.ht;
  return r;
}
// служебные классы строки (nw — только что появилась, up — счёт вырос) переживают смену места; раньше className затирал их при каждой отрисовке
function setCls(r,base){var c=base+(r.classList.contains('up')?' up':'')+(r.classList.contains('nw')?' nw':'');if(r.className!==c)r.className=c;}
// пульс при росте: класс снимается, страница пересчитывается, класс ставится заново — анимация гарантированно стартует с начала при каждом росте
function pulse(r){r.classList.remove('up');void r.offsetWidth;r.classList.add('up');clearTimeout(r._u);r._u=setTimeout(function(){r.classList.remove('up');},800);}
// число плавно «набегает» от показанного к новому значению (так счёт заметно растёт, а не прыгает)
function countTo(el,to){
  to=+to||0;
  if(el._to===to)return;
  var from=el._v;el._to=to;
  if(from===undefined||!window.requestAnimationFrame||document.hidden){el._v=to;el.textContent=fmt(to);return;}
  cancelAnimationFrame(el._r);
  var t0=performance.now(),dur=450;
  (function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el._v=Math.round(from+(to-from)*e);el.textContent=fmt(el._v);if(k<1)el._r=requestAnimationFrame(step);else{el._v=to;}})(t0);
}
function render(){
  var n=Math.max(1,Math.min(10,Math.round(+S.count)||5)),items=LIST.slice(0,n),first={},k,i,seen={};
  for(k in MAP)first[k]=MAP[k].getBoundingClientRect().top;
  items.forEach(function(d,idx){
    var nm=d.name||'Гость',r=MAP[nm],isNew=false;seen[nm]=1;
    if(!r){r=MAP[nm]=mk();isNew=true;}
    r.style.setProperty('--i',idx);r.style.order=idx;
    setCls(r,'row r'+(idx+1)+(idx>2?' rx':''));
    var m=r.querySelector('.rk img.m');if(m.dataset.s!==String(idx>2?3:idx)){m.dataset.s=String(idx>2?3:idx);m.src=medalOf(idx);}
    r.querySelector('.rk b').textContent=idx+1;
    var f=r.querySelector('.av img.f');if(idx<3&&f.dataset.s!==String(idx)){f.dataset.s=String(idx);f.src=frameOf(idx);}
    var a=r.querySelector('.av i'),av=/^https?:\/\//.test(d.avatar||'')?d.avatar:'';
    if(a.dataset.av!==av||a.dataset.nm!==nm){a.dataset.av=av;a.dataset.nm=nm;a.style.backgroundImage=av?'url("'+av.replace(/"/g,'%22')+'")':'none';a.style.backgroundColor=av?'#374151':colorOf(nm);a.textContent=av?'':nm.charAt(0).toUpperCase();}
    setNm(r.querySelector('.nm'),nm);
    countTo(r.querySelector('.lk span'),d.likes);
    if(PREV[nm]!==undefined&&d.likes>PREV[nm])pulse(r);
    PREV[nm]=d.likes;
    if(isNew){rowsEl.appendChild(r);setTimeout(function(){r.classList.remove('nw');},700);} // порядок мест задаёт CSS order, строки в DOM не переставляются: от этого перезапускались все анимации
  });
  for(k in MAP)if(!seen[k]){MAP[k].remove();delete MAP[k];}
  if(BOX&&!render.busy){render.busy=1;fitSelf();render.busy=0;}
  marquee();
  // плавное перестроение: строки, сменившие место, «ездят» на новое
  for(i=0;i<items.length;i++){var el=MAP[items[i].name||'Гость'];if(!el||first[items[i].name||'Гость']===undefined||!el.animate)continue;var dy=(first[items[i].name||'Гость']-el.getBoundingClientRect().top)/(PK||1);if(Math.abs(dy)>2)el.animate([{translate:'0 '+dy+'px'},{translate:'0 0'}],{duration:520,easing:'cubic-bezier(.2,.9,.3,1)'});}
}
var Q=new URLSearchParams(location.search),FIXED=+Q.get('port')||0;
var REMOTE=!(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&!FIXED);
var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);
var nc=document.getElementById('nc'),ncT=null;
function offline(){if(REMOTE&&!ncT)ncT=setTimeout(function(){nc.style.display='block'},4000);}
function online(){clearTimeout(ncT);ncT=null;nc.style.display='none';}
var told=false;
function tellReady(){if(told)return;told=true;try{if(window.parent&&window.parent!==window)window.parent.postMessage({echochat:'likes2-ready'},'*');}catch(_){}}
window.addEventListener('message',function(e){var d=e.data;if(window.parent!==window&&e.source===window.parent&&d&&d.echochat==='fit'){if(d.w>0&&d.h>0){BOX={w:+d.w,h:+d.h};apply();}else{var k=+d.k;if(k>0.1&&k<=1.5&&k!==PK){PK=k;apply();}}}});
function bind(es){
  es.addEventListener('l2settings',function(e){S=Object.assign(S,JSON.parse(e.data));apply();tellReady();});
  es.addEventListener('likes',function(e){var d=JSON.parse(e.data);LIST=Array.isArray(d)?d:[];render();});
  es.addEventListener('clear',function(){LIST=[];PREV={};render();});
}
function connect(){
  if(!REMOTE){bind(new EventSource('/events'));return;}
  var r=PORTS.length>1?Math.floor(Math.random()*Math.min(5,PORTS.length)):0,order=PORTS.slice(r).concat(PORTS.slice(0,r)),i=0;
  (function probe(){
    var port=order[i%order.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,dead=false,t,rt=null;
    function again(){if(dead)return;dead=true;clearTimeout(t);clearTimeout(rt);es.close();offline();setTimeout(probe,order.length>1&&i%order.length?30:2500);}
    t=setTimeout(function(){if(!got)again();},1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);online();}});
    es.onerror=function(){if(!got){again();return;}offline();if(!rt)rt=setTimeout(function(){i=0;again();},6000);};
    es.onopen=function(){if(got){online();clearTimeout(rt);rt=null;}};
    bind(es);
  })();
}
apply();connect();
</script></body></html>
