:where(.d-default) .rk .m{display:block;position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
:where(.d-default) .row .rk b{position:relative;font-size:15px;line-height:1;padding-top:0;margin-top:-1px;color:#fff;-webkit-text-stroke:2.5px rgba(150,10,70,.85);paint-order:stroke fill;text-shadow:none}
:where(.d-old) .rk b{font-size:18px;-webkit-text-stroke:2.6px rgba(60,25,10,.75)}
.d-sticker .rk{width:40px;height:38px;margin-right:6px}
.d-sticker .rk .m{display:block}
.d-sticker .rk b{font-size:15px;line-height:1;padding-top:0;margin-top:-1px;-webkit-text-stroke:3px #1b1033}
.d-flowery .rk b{font-size:17px;-webkit-text-stroke:2.6px rgba(150,10,70,.8)}
.d-spotlight .rk b{font-size:12.5px;-webkit-text-stroke:2.3px rgba(150,10,70,.85)}
.d-spotlight .r1 .rk{display:block;width:34px;height:32px;margin-right:6px}
.d-spotlight .r1 .rk b{font-size:13px}

<script>

function colorOf(s){var h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length];}
function fmt(n){n=+n||0;if(n>=1e7)return (n/1e6).toFixed(0)+'M';if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';return n.toLocaleString('en-US');}
function apply(){
  var d=['default','spotlight','sticker','flowery'].indexOf(S.design)>=0?S.design:'default';

  var bgOff=S.bg===false&&d!=='sticker'&&d!=='flowery';
  document.body.className=(bgOff?'nobg':'')+(S.title===false?' notitle':'')+(BOX?' pv':'');

}
// предпросмотр в приложении: всегда по центру окошка; чем больше строк, тем мельче (масштаб считаем по реальному размеру)
function fitSelf(){

  document.body.classList.add('pv');
  board.style.zoom=1;
  var bw=board.offsetWidth+36,bh=board.offsetHeight+44,k=Math.min(1.5,.96*BOX.w/bw,.96*BOX.h/bh);
  PK=Math.max(.15,k);board.style.zoom=PK;

function setNm(el,nm){var t=el.firstChild;if(!t||t.className!=='nt'){el.textContent='';t=document.createElement('span');t.className='nt';el.appendChild(t);}if(t.textContent!==nm){t.textContent=nm;el.dataset.m='';}}
function marquee(){for(var k in MAP){var el=MAP[k].querySelector('.nm'),t=el&&el.firstChild;if(!t)continue;var d=Math.ceil(t.offsetWidth-el.clientWidth),key=d+'|'+el.clientWidth;if(el.dataset.m===key)continue;el.dataset.m=key;if(d>2){el.style.setProperty('--d',d);el.style.setProperty('--t',(4+d/22).toFixed(1)+'s');el.classList.add('mq');}else{el.classList.remove('mq');}}}

  return r;

// служебные классы строки (nw — только что появилась, up — счёт вырос) переживают смену места
function setCls(r,base){var c=base+(r.classList.contains('up')?' up':'')+(r.classList.contains('nw')?' nw':'')+(r.classList.contains('nf')?' nf':'');if(r.className!==c)r.className=c;}
// пульс при росте: класс снимается, страница пересчитывается, класс ставится заново — анимация стартует с начала при каждом росте
function pulse(r){r.classList.remove('up');void r.offsetWidth;r.classList.add('up');clearTimeout(r._u);r._u=setTimeout(function(){r.classList.remove('up');},800);}
// число плавно «набегает» от показанного к новому значению
function countTo(el,to){
  to=+to||0;
  if(el._to===to)return;
  var from=el._v;el._to=to;
  if(from===undefined||!window.requestAnimationFrame||document.hidden){el._v=to;el.textContent=fmt(to);return;}
  cancelAnimationFrame(el._r);

  (function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el._v=Math.round(from+(to-from)*e);el.textContent=fmt(el._v);if(k<1)el._r=requestAnimationFrame(step);else{el._v=to;}})(t0);
}
function render(){
  var n=Math.max(1,Math.min(10,Math.round(+S.count)||5)),items=LIST.slice(0,n),first={},k,i,seen={},wasEmpty=true;for(k in MAP){wasEmpty=false;break;}

    setCls(r,'row r'+(idx+1)+(idx>2?' rx':''));
