<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Топ подарков V2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;height:100%;color:#fff}
#root{position:fixed;inset:0;display:flex;flex-direction:column;padding:14px 18px;box-sizing:border-box}
#board{width:344px;display:flex;flex-direction:column;align-self:center;zoom:1;--t1:#ffb62e;--t2:#c2411c;--vc:#ffe27a}
body.pv #root{justify-content:center;padding:10px}
/* заголовок: пилюля с короной */
#ttl{align-self:flex-start;display:flex;align-items:center;gap:9px;padding:5px 18px 5px 5px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.16em;white-space:nowrap;background:linear-gradient(90deg,var(--t1),var(--t2));border:2px solid rgba(255,255,255,.55);box-shadow:0 5px 16px rgba(0,0,0,.42),0 0 18px color-mix(in srgb,var(--t1) 45%,transparent),inset 0 2px 4px rgba(255,255,255,.35);text-shadow:0 2px 4px rgba(0,0,0,.4);margin:0 0 22px 6px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
#ttl .tc{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);flex:none}
#ttl .tc svg{width:20px;height:16px;animation:tbob 2.6s ease-in-out infinite}
body.notitle #ttl{display:none}body.notitle #rows{padding-top:24px}
#rows{position:relative;display:flex;flex-direction:column;gap:10px}
/* строка */
.row{position:relative;display:flex;align-items:center;height:60px;padding:0 18px 0 9px;box-sizing:border-box;--g1:#6a38c8;--g2:#3c2183;--g3:#241346;--bd:rgba(214,150,255,.75);--gl:rgba(190,100,255,.35);--r1:#ff7fcb;--r2:#8b3cf0;--rt:#fff;--vc2:#ffa6d8;--ring:rgba(255,160,225,.85)}
.row.nw{animation:rin .5s cubic-bezier(.2,1.2,.4,1) both}
.r1{--g1:#c9961a;--g2:#7a5418;--g3:#3a2a48;--bd:#ffd25a;--gl:rgba(255,200,70,.6);--r1:#fff2a0;--r2:#e29a12;--rt:#6b4300;--vc2:#ffe27a;--ring:#ffd25a}
.r2{--g1:#9094ad;--g2:#5c5f7a;--g3:#2f2a4a;--bd:#eceffb;--gl:rgba(220,226,255,.28);--r1:#ffffff;--r2:#a7adc9;--rt:#3d4160;--vc2:#ffffff;--ring:#e6e9f7}
.r3{--g1:#b4733c;--g2:#7c4627;--g3:#35264a;--bd:#eba873;--gl:rgba(235,150,90,.3);--r1:#ffd2ab;--r2:#c0733a;--rt:#5a2c10;--vc2:#ffd2a8;--ring:#eba873}
.pl{position:absolute;inset:0;border-radius:999px;overflow:hidden;background:linear-gradient(90deg,var(--g1),var(--g2) 52%,var(--g3));border:2.5px solid var(--bd);box-shadow:0 0 0 0 transparent,0 5px 16px rgba(0,0,0,.45),0 0 16px var(--gl),inset 0 2px 5px rgba(255,255,255,.22)}
.pl::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.04) 34%,rgba(255,255,255,.14) 42%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.14) 58%,rgba(255,255,255,.04) 66%,transparent 78%);background-size:320% 100%;background-position:150% 0;animation:shine 19s cubic-bezier(.4,0,.6,1) infinite;animation-delay:calc(var(--i,0)*1.4s);mix-blend-mode:screen;pointer-events:none}
body.nobg .pl{display:none}
/* место */
.rk{position:relative;z-index:1;flex:none;width:36px;height:36px;border-radius:50%;margin-right:9px;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,var(--r1),var(--r2));border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 -3px 5px rgba(0,0,0,.15)}
.rk b{font-size:18px;font-weight:900;color:var(--rt);line-height:1;font-variant-numeric:tabular-nums}
.rx .rk b{text-shadow:0 1px 2px rgba(60,10,80,.6)}
.cw{position:absolute;left:-7px;top:-23px;width:38px;height:30px;z-index:3;transform:rotate(-17deg);transform-origin:50% 90%;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));display:none}
.r1 .cw{display:block}
.sk{position:absolute;width:13px;height:13px;z-index:4;pointer-events:none;animation:tw 2.2s ease-in-out infinite;display:none}
.r1 .sk{display:block}.sk.a{left:34px;top:-12px}.sk.b{left:-12px;top:6px;animation-delay:.9s;width:10px;height:10px}
/* аватарка */
.av{position:relative;z-index:1;flex:none;width:42px;height:42px;margin:0 12px 0 0}
.av i{position:absolute;inset:0;border-radius:50%;background:#4b5563 center/cover no-repeat;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;overflow:hidden;border:3px solid var(--ring);box-sizing:border-box;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.r1 .av::before{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 16px 3px rgba(255,205,80,.8);animation:glow 2.4s ease-in-out infinite}
/* ник и подпись */
.tx{position:relative;z-index:1;min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;line-height:1.1;text-shadow:0 2px 5px rgba(0,0,0,.65)}
.nm{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;max-width:100%;min-width:0}
.nm .nt{display:inline-block;will-change:transform}
.nm.mq{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 14px),transparent)}
.nm.mq .nt{animation:mq var(--t,6s) ease-in-out infinite}
@keyframes mq{0%,22%{transform:translateX(0)}50%,72%{transform:translateX(calc(-1px*var(--d,0) - 6px))}100%{transform:translateX(0)}}
.cap{font-size:12px;font-weight:600;color:rgba(255,255,255,.72);margin-top:3px}
/* счёт справа */
.val{position:relative;z-index:1;flex:none;display:flex;align-items:center;gap:6px;margin-left:8px;font-size:22px;font-weight:900;color:var(--vc2);text-shadow:0 2px 5px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.val .ic{width:20px;height:20px;flex:none;transform-origin:50% 55%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));animation:cspin 5s ease-in-out infinite}
.val .n{display:inline-block;transform-origin:100% 50%}
.row.up .val .ic{animation:beat .7s ease-in-out}.row.up .val .n{animation:bump .7s ease-out}
@keyframes rin{from{opacity:0;transform:translateX(-26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:150% 0}55%,100%{background-position:-50% 0}}
@keyframes bob{0%,100%{transform:rotate(-17deg) translateY(0)}50%{transform:rotate(-12deg) translateY(-3px)}}
@keyframes tbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes beat{0%{transform:scale(1)}22%{transform:scale(1.3)}44%{transform:scale(1.05)}64%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes cspin{0%,62%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.nm.mq .nt,.pl::after,.cw,.sk,.r1 .av::before,.val .ic{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#e08a00"/></linearGradient>
<linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ac2"/><stop offset=".5" stop-color="#ff3d86"/><stop offset="1" stop-color="#d4155f"/></linearGradient>
<radialGradient id="gCoin" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff6b0"/><stop offset=".5" stop-color="#ffc928"/><stop offset="1" stop-color="#d98200"/></radialGradient>
</defs>
<symbol id="i-crown" viewBox="0 0 64 50"><path d="M7 41 L3 14 L19 26 L32 8 L45 26 L61 14 L57 41 Z" fill="url(#gGold)" stroke="#8f5200" stroke-width="2.6" stroke-linejoin="round"/><rect x="6" y="39" width="52" height="8" rx="3.5" fill="url(#gGold)" stroke="#8f5200" stroke-width="2.6"/><circle cx="3" cy="12" r="4.2" fill="#fff3a8" stroke="#8f5200" stroke-width="2.2"/><circle cx="32" cy="6" r="4.6" fill="#fff3a8" stroke="#8f5200" stroke-width="2.2"/><circle cx="61" cy="12" r="4.2" fill="#fff3a8" stroke="#8f5200" stroke-width="2.2"/><circle cx="32" cy="31" r="3.6" fill="#ff3d86" stroke="#8f1d4a" stroke-width="1.4"/><circle cx="17" cy="34" r="2.6" fill="#8b5cf6" stroke="#4b2a9a" stroke-width="1.2"/><circle cx="47" cy="34" r="2.6" fill="#8b5cf6" stroke="#4b2a9a" stroke-width="1.2"/><path d="M11 42.5h42" stroke="#fff8c8" stroke-width="1.6" stroke-linecap="round" opacity=".75"/></symbol>
<symbol id="i-heart" viewBox="0 0 32 30"><path d="M16 28.2C6.2 20.6 2 15 2 9.8 2 5.7 5 2.8 8.9 2.8c3.1 0 5.7 1.8 7.1 4.4 1.4-2.6 4-4.4 7.1-4.4C27 2.8 30 5.7 30 9.8c0 5.2-4.2 10.8-14 18.4Z" fill="url(#gHeart)" stroke="#9c0f48" stroke-width="2" stroke-linejoin="round"/><path d="M7.6 8.2c.8-1.7 2.4-2.5 4-2.2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/></symbol>
<symbol id="i-coin" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="url(#gCoin)" stroke="#8f5200" stroke-width="2"/><circle cx="16" cy="16" r="10.2" fill="none" stroke="#b86a00" stroke-width="1.6" opacity=".85"/><path d="M16 8.2l2.3 5 5.4.6-4 3.7 1.1 5.4-4.8-2.7-4.8 2.7 1.1-5.4-4-3.7 5.4-.6Z" fill="#fff3a8" stroke="#a65e00" stroke-width="1.2" stroke-linejoin="round"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6Z" fill="#fff8c2" stroke="#ffc928" stroke-width="1.2" stroke-linejoin="round"/></symbol>
</svg>
<div id="nc" style="display:none;position:fixed;left:10px;top:10px;z-index:9999;background:rgba(0,0,0,.65);color:#fff;font:600 13px/1.3 'Segoe UI',Arial,sans-serif;padding:7px 12px;border-radius:999px">Нет связи с приложением ЭхоЧат — запустите его на этом компьютере</div>
<div id="root"><div id="board"><div id="ttl"><span class="tc"><svg viewBox="0 0 64 50"><use href="#i-crown"/></svg></span><span>ТОП ПОДАРКИ</span></div><div id="rows"></div></div></div>
<script>
var S={design:'default',count:5,title:true,bg:true},PK=1,LIST=[],PREV={},BOX=null;
var board=document.getElementById('board'),rowsEl=document.getElementById('rows'),MAP={};
var COLORS=['#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6','#a855f7','#f97316','#22c55e'];
function colorOf(s){var h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length];}
function fmt(n){n=+n||0;if(n>=1e7)return (n/1e6).toFixed(0)+'M';if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','')+'M';return n.toLocaleString('en-US');}
function apply(){
  document.body.className=(S.bg===false?'nobg':'')+(S.title===false?' notitle':'')+(BOX?' pv':'');
  board.style.zoom=PK;
  render();
  fitSelf();
}
// предпросмотр в приложении: всегда по центру окошка; чем больше строк, тем мельче (масштаб считаем по реальному размеру)
function fitSelf(){
  if(!BOX)return;
  document.body.classList.add('pv');
  board.style.zoom=1;
  var bw=board.offsetWidth+36,bh=board.offsetHeight+44,k=Math.min(1.5,.96*BOX.w/bw,.96*BOX.h/bh);
  PK=Math.max(.15,k);board.style.zoom=PK;
}
function setNm(el,nm){var t=el.firstChild;if(!t||t.className!=='nt'){el.textContent='';t=document.createElement('span');t.className='nt';el.appendChild(t);}if(t.textContent!==nm){t.textContent=nm;el.dataset.m='';}}
function marquee(){for(var k in MAP){var el=MAP[k].querySelector('.nm'),t=el&&el.firstChild;if(!t)continue;var d=Math.ceil(t.offsetWidth-el.clientWidth),key=d+'|'+el.clientWidth;if(el.dataset.m===key)continue;el.dataset.m=key;if(d>2){el.style.setProperty('--d',d);el.style.setProperty('--t',(4+d/22).toFixed(1)+'s');el.classList.add('mq');}else{el.classList.remove('mq');}}}
function mk(){
  var r=document.createElement('div');r.className='row nw';
  r.innerHTML='<div class="pl"></div><svg class="cw" viewBox="0 0 64 50"><use href="#i-crown"/></svg><svg class="sk a" viewBox="0 0 24 24"><use href="#i-spark"/></svg><svg class="sk b" viewBox="0 0 24 24"><use href="#i-spark"/></svg><div class="rk"><b></b></div><div class="av"><i></i></div><div class="tx"><span class="nm"></span><span class="cap">монет</span></div><span class="val"><svg class="ic" viewBox="0 0 32 32"><use href="#i-coin"/></svg><span class="n"></span></span>';
  return r;
}
// служебные классы строки (nw — только что появилась, up — счёт вырос) переживают смену места
function setCls(r,base){var c=base+(r.classList.contains('up')?' up':'')+(r.classList.contains('nw')?' nw':'');if(r.className!==c)r.className=c;}
// пульс при росте: класс снимается, страница пересчитывается, класс ставится заново — анимация стартует с начала при каждом росте
function pulse(r){r.classList.remove('up');void r.offsetWidth;r.classList.add('up');clearTimeout(r._u);r._u=setTimeout(function(){r.classList.remove('up');},800);}
// число плавно «набегает» от показанного к новому значению
function countTo(el,to){
  to=+to||0;
  if(el._to===to)return;
  var from=el._v;el._to=to;
  if(from===undefined||!window.requestAnimationFrame||document.hidden){el._v=to;el.textContent=fmt(to);return;}
  cancelAnimationFrame(el._r);
  var t0=performance.now(),dur=450;
  (function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el._v=Math.round(from+(to-from)*e);el.textContent=fmt(el._v);if(k<1)el._r=requestAnimationFrame(step);else{el._v=to;}})(t0);
}
function render(){
  var n=Math.max(1,Math.min(10,Math.round(+S.count)||5)),items=LIST.slice(0,n),first={},k,i,seen={};
  for(k in MAP)first[k]=MAP[k].getBoundingClientRect().top;
  items.forEach(function(d,idx){
    var nm=d.name||'Гость',r=MAP[nm],isNew=false;seen[nm]=1;
    if(!r){r=MAP[nm]=mk();isNew=true;}
    r.style.setProperty('--i',idx);r.style.order=idx;
    setCls(r,'row r'+(idx+1)+(idx>2?' rx':''));
    r.querySelector('.rk b').textContent=idx+1;
    var a=r.querySelector('.av i'),av=/^https?:\/\//.test(d.avatar||'')?d.avatar:'';
    if(a.dataset.av!==av||a.dataset.nm!==nm){a.dataset.av=av;a.dataset.nm=nm;a.style.backgroundImage=av?'url("'+av.replace(/"/g,'%22')+'")':'none';a.style.backgroundColor=av?'#374151':colorOf(nm);a.textContent=av?'':nm.charAt(0).toUpperCase();}
    setNm(r.querySelector('.nm'),nm);
    countTo(r.querySelector('.val .n'),d.likes);
    if(PREV[nm]!==undefined&&d.likes>PREV[nm])pulse(r);
    PREV[nm]=d.likes;
    if(isNew){rowsEl.appendChild(r);setTimeout(function(){r.classList.remove('nw');},700);} // порядок мест задаёт CSS order, строки в DOM не переставляются
  });
  for(k in MAP)if(!seen[k]){MAP[k].remove();delete MAP[k];}
  if(BOX&&!render.busy){render.busy=1;fitSelf();render.busy=0;}
  marquee();
  // плавное перестроение: строки, сменившие место, «ездят» на новое
  for(i=0;i<items.length;i++){var el=MAP[items[i].name||'Гость'];if(!el||first[items[i].name||'Гость']===undefined||!el.animate)continue;var dy=(first[items[i].name||'Гость']-el.getBoundingClientRect().top)/(PK||1);if(Math.abs(dy)>2)el.animate([{translate:'0 '+dy+'px'},{translate:'0 0'}],{duration:520,easing:'cubic-bezier(.2,.9,.3,1)'});}
}
var Q=new URLSearchParams(location.search),FIXED=+Q.get('port')||0;
var REMOTE=!(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&!FIXED);
var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);
var nc=document.getElementById('nc'),ncT=null;
function offline(){if(REMOTE&&!ncT)ncT=setTimeout(function(){nc.style.display='block'},4000);}
function online(){clearTimeout(ncT);ncT=null;nc.style.display='none';}
var told=false;
function tellReady(){if(told)return;told=true;try{if(window.parent&&window.parent!==window)window.parent.postMessage({echochat:'gifts2-ready'},'*');}catch(_){}}
window.addEventListener('message',function(e){var d=e.data;if(window.parent!==window&&e.source===window.parent&&d&&d.echochat==='fit'){if(d.w>0&&d.h>0){BOX={w:+d.w,h:+d.h};apply();}else{var k=+d.k;if(k>0.1&&k<=1.5&&k!==PK){PK=k;apply();}}}});
function bind(es){
  es.addEventListener('g2settings',function(e){S=Object.assign(S,JSON.parse(e.data));apply();tellReady();});
  es.addEventListener('gifts',function(e){var d=JSON.parse(e.data);LIST=Array.isArray(d)?d:[];render();});
  es.addEventListener('clear',function(){LIST=[];PREV={};render();});
}
function connect(){
  if(!REMOTE){bind(new EventSource('/events'));return;}
  var r=PORTS.length>1?Math.floor(Math.random()*Math.min(5,PORTS.length)):0,order=PORTS.slice(r).concat(PORTS.slice(0,r)),i=0;
  (function probe(){
    var port=order[i%order.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,dead=false,t,rt=null;
    function again(){if(dead)return;dead=true;clearTimeout(t);clearTimeout(rt);es.close();offline();setTimeout(probe,order.length>1&&i%order.length?30:2500);}
    t=setTimeout(function(){if(!got)again();},1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);online();}});
    es.onerror=function(){if(!got){again();return;}offline();if(!rt)rt=setTimeout(function(){i=0;again();},6000);};
    es.onopen=function(){if(got){online();clearTimeout(rt);rt=null;}};
    bind(es);
  })();
}
apply();connect();
</script></body></html>
