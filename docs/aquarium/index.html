.wl svg{display:block;width:720px;height:202px;overflow:visible}
#w0{animation:wvl 6s linear infinite}
#w1{animation:wvl 26s linear infinite}
#w2{animation:wvr 38s linear infinite}
#w3{animation:wvl 20s linear infinite}
@keyframes wvl{to{transform:translateX(-360px)}}
@keyframes wvr{from{transform:translateX(-360px)}to{transform:translateX(0)}}
#nc{position:fixed;left:10px;top:10px;display:none;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.65);color:#fbbf24;font:13px "Segoe UI",Arial,sans-serif}
.tb{transform-box:fill-box}
.paused *{animation-play-state:paused!important}

<script>
/*ASSETS*/
var Q=new URLSearchParams(location.search),FIXED=+Q.get('port')||0;
var REMOTE=!(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&!FIXED);
var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i)};
var sc=$('sc'),wetL=$('wetL'),airL=$('airL'),fx=$('fx'),bubL=$('bubL');
function fit(){var k=Math.min(window.innerWidth/540,window.innerHeight/560);sc.style.transform='translateX(-50%) scale('+k+')';}
fit();window.addEventListener('resize',fit);
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
var R=Math.random,SURF=222,X0=90,X1=450,FLOOR=388,GR=27;
var EMOJI=['🌹','🍩','❤️','🎁','⭐','🍭','🧸','💎','🌸','🍓','🫶','🍰'];
// ---- пузырьки воздуха ----
function bubble(x,y,r,top,dur){
  var b=el('circle',{cx:x,cy:y,r:r,fill:'url(#gBub)',stroke:'#fff','stroke-opacity':.5,'stroke-width':.8},bubL);
  var h=y-top,dx=(R()-.5)*18;
  var a=b.animate([{transform:'translate(0,0)',opacity:.9},{transform:'translate('+dx+'px,'+(-h*.5)+'px)',opacity:.8},{transform:'translate('+(-dx)+'px,'+(-h)+'px)',opacity:0}],{duration:dur,easing:'ease-in'});
  a.onfinish=function(){b.remove();};
}
var BSRC=[140,424],bi=0;
setInterval(function(){if(document.hidden)return;bubble(BSRC[bi++%2]+R()*8,404,1.8+R()*2.6,SURF+4,3200+R()*1800);},1400); // пузырьки со дна из двух мест, понемногу
// ---- брызги ----
function splash(x){
  var r=el('ellipse',{cx:x,cy:SURF,rx:8,ry:2.2,fill:'none',stroke:'#e9fdff','stroke-width':2.4},fx);
  r.style.transformBox='fill-box';r.style.transformOrigin='50% 50%'; // без этого кольцо масштабировалось от угла экрана и улетало вправо
  var a=r.animate([{transform:'scale(1)',opacity:.95},{transform:'scale(5.2,3)',opacity:0}],{duration:900,easing:'ease-out'});a.onfinish=function(){r.remove();};
  for(var i=0;i<7;i++){(function(){var d=el('circle',{cx:x,cy:SURF-2,r:1.8+R()*2,fill:'#eafcff'},fx),vx=(R()-.5)*60,vy=-(26+R()*38);
    var q=d.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+vx*.6+'px,'+vy+'px)',opacity:1,offset:.45},{transform:'translate('+vx+'px,'+(vy*.1+8)+'px)',opacity:0}],{duration:650+R()*250,easing:'ease-out'});q.onfinish=function(){d.remove();};})();}
  for(var j=0;j<6;j++)bubble(x+(R()-.5)*30,SURF+10+R()*36,1.6+R()*2.4,SURF+2,1100+R()*900);
}
// ---- подарки ----
var MAXG=60,LIFE=150000,gifts=[],next=0;
function emo(p,d){var t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':34,x:0,y:2},p);t.textContent=d.emoji||EMOJI[(next-1)%EMOJI.length];}
function mk(d){
  var g=el('g',{},airL),pop=el('g',{},g),bob=el('g',{},pop);
  el('circle',{r:GR,fill:'url(#gGift)',stroke:'#fff','stroke-opacity':.55,'stroke-width':1.4},bob);
  var inner=el('g',{},bob);
  if(d.image&&/^(https?:|data:|\/)/.test(d.image)){var im=el('image',{x:-20,y:-20,width:40,height:40,preserveAspectRatio:'xMidYMid meet'},inner);im.setAttributeNS('http://www.w3.org/1999/xlink','href',d.image);im.setAttribute('href',d.image);
    im.addEventListener('error',function(){inner.removeChild(im);emo(inner,d);});}
  else emo(inner,d);
  el('ellipse',{cx:-9,cy:-14,rx:9,ry:5,fill:'#fff','fill-opacity':.55,transform:'rotate(-30 -9 -14)'},bob);
  return {g:g,pop:pop};
}
function addGift(d){
  next++;if(gifts.length>=MAXG)kill(gifts[0]);
  var m=mk(d),x=X0+GR+8+R()*(X1-X0-2*GR-16);
  var it={g:m.g,pop:m.pop,x:x,y:-40-R()*30,vx:(R()-.5)*14,vy:60+R()*60,ph:'air',rot:(R()-.5)*30,spin:(R()-.5)*60,t0:performance.now(),ph2:R()*6.28,ty:FLOOR-R()*70,tx:x,tt:0,born:Date.now()};
  gifts.push(it);place(it);
  it.life=setTimeout(function(){kill(it);},LIFE);
}
var TT=0;
function place(it){it.g.setAttribute('transform','translate('+it.x.toFixed(1)+' '+(it.y+Math.sin(TT*1.9+it.ph2)*2).toFixed(1)+') rotate('+it.rot.toFixed(1)+')');}
function kill(it){
  if(!it||it.dead)return;it.dead=true;clearTimeout(it.life);var q=gifts.indexOf(it);if(q>=0)gifts.splice(q,1);
  if(it.ph!=='air')for(var i=0;i<4;i++)bubble(it.x+(R()-.5)*20,it.y,1.4+R()*2,SURF+2,900+R()*700);
  it.pop.style.transformBox='fill-box';it.pop.style.transformOrigin='50% 50%';
  var a=it.pop.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.35)',opacity:0}],{duration:420,easing:'ease-out'});a.onfinish=function(){it.g.remove();};
}
function clearAll(){gifts.slice().forEach(kill);}
function step(it,dt,t){
  if(it.ph==='air'){
    it.vy+=520*dt;it.y+=it.vy*dt;it.x+=it.vx*dt;it.rot+=it.spin*dt;
    if(it.x<X0+GR){it.x=X0+GR;it.vx=Math.abs(it.vx);}if(it.x>X1-GR){it.x=X1-GR;it.vx=-Math.abs(it.vx);}
    if(it.y+GR>=SURF){it.ph='sink';wetL.appendChild(it.g);it.vy*=.42;it.vx*=.4;it.spin*=.2;splash(it.x);}
  }else if(it.ph==='sink'){
    it.vy+=(38-it.vy)*Math.min(1,dt*2.4);it.vx+=(0-it.vx)*Math.min(1,dt*1.8);
    it.x+=(it.vx+Math.sin(t*1.7+it.ph2)*16)*dt;it.y+=it.vy*dt;it.rot+=(Math.sin(t*1.3+it.ph2)*8-it.rot)*Math.min(1,dt*1.5);
    if(it.y>=it.ty){it.ph='swim';it.tt=0;}
  }else{
    it.tt-=dt;if(it.tt<=0){it.tt=4+R()*5;it.tx=X0+GR+10+R()*(X1-X0-2*GR-20);it.ty=SURF+GR+24+R()*(FLOOR-SURF-GR-24);}
    it.vx+=((it.tx-it.x)*.22-it.vx)*Math.min(1,dt*1.1);it.vy+=((it.ty-it.y)*.22-it.vy)*Math.min(1,dt*1.1);
    it.x+=it.vx*dt+Math.sin(t*1.2+it.ph2)*8*dt;it.y+=it.vy*dt+Math.cos(t*.9+it.ph2)*7*dt;it.rot+=(Math.sin(t*.8+it.ph2)*7-it.rot)*Math.min(1,dt*1.5);
  }
  if(it.ph!=='air'){if(it.x<X0+GR)it.x=X0+GR;if(it.x>X1-GR)it.x=X1-GR;if(it.y>FLOOR+10)it.y=FLOOR+10;if(it.y<SURF+GR-8)it.y=SURF+GR-8;}
  place(it);
}
function apart(){ // мягко раздвигаем подарки, чтобы не слипались в кучу
  for(var i=0;i<gifts.length;i++){var a=gifts[i];if(a.ph==='air')continue;
    for(var j=i+1;j<gifts.length;j++){var b=gifts[j];if(b.ph==='air')continue;
      var dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,m=GR*1.7;
      if(d2<m*m&&d2>.01){var d=Math.sqrt(d2),k=(m-d)*.035,ux=dx/d,uy=dy/d;a.x-=ux*k;a.y-=uy*k;b.x+=ux*k;b.y+=uy*k;}}}
}
var last=0;
function loop(now){
  requestAnimationFrame(loop);if(document.hidden||!gifts.length){last=now;return;} // нет подарков: ничего не считаем
  var ms=now-last;if(ms<30)return; // не чаще ~30 кадров/с
  var dt=Math.min(.06,ms/1000);last=now;var t=now/1000;TT=t;
  for(var k=gifts.length-1;k>=0;k--)step(gifts[k],dt,t);
  apart();
}
requestAnimationFrame(loop);
// ---- топ дарителей на облаке: 1-е место по центру с короной, 2-е слева, 3-е справа ----
var topL=$('topL'),SLOTS=[{x:270,y:474,r:25,ring:'#ffd34d',crown:1},{x:202,y:480,r:20,ring:'#d9e2ff'},{x:338,y:480,r:20,ring:'#ffb48a'}];
function drawTop(list){
  while(topL.firstChild)topL.removeChild(topL.firstChild);
  (list||[]).slice(0,3).forEach(function(u,i){

var told=false,nc=$('nc');
var SHOWMSG=window.parent!==window||Q.has('debug');

function online(){nc.style.display='none';}function offline(){if(SHOWMSG)nc.style.display='block';}
function bind(es){
  es.addEventListener('catsettings',function(){tellReady();});
  es.addEventListener('aqgift',function(e){try{var d=JSON.parse(e.data),n=Math.max(1,Math.min(30,Math.floor(+d.count)||1));for(var k=0;k<n;k++)(function(k){setTimeout(function(){addGift(d);},k*160);})(k);}catch(_){}});

}
function connect(){
  if(!REMOTE){bind(new EventSource('/events'));return;}
  var r=PORTS.length>1?Math.floor(Math.random()*Math.min(5,PORTS.length)):0,order=PORTS.slice(r).concat(PORTS.slice(0,r)),i=0;
  (function probe(){
    var port=order[i%order.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,dead=false,t,rt=null;
    function again(){if(dead)return;dead=true;clearTimeout(t);clearTimeout(rt);es.close();offline();setTimeout(probe,order.length>1&&i%order.length?30:2500);}
    t=setTimeout(function(){if(!got)again();},1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);online();}});
    es.onerror=function(){if(!got){again();return;}offline();if(!rt)rt=setTimeout(function(){i=0;again();},6000);};
    es.onopen=function(){if(got){online();clearTimeout(rt);rt=null;}};
    bind(es);
  })();
}
