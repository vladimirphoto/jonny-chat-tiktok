<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>DonationAlerts</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;justify-content:center;pointer-events:none}
#stage.b{align-items:flex-end;padding-bottom:28px}
#stage.m{align-items:center}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:460px;text-align:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.card.out{animation:out .5s ease-in both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.7)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-16px) scale(.9)}}
.art img{display:block;width:230px;height:230px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.card.at-top{flex-direction:column-reverse}
.tx{display:flex;flex-direction:column;align-items:center;gap:2px;max-width:440px}
.nm{font-size:27px;font-weight:800;line-height:1.1;word-break:break-word}
.am{font-size:44px;font-weight:900;line-height:1.05}
.ms{margin-top:4px;font-size:19px;font-weight:600;line-height:1.25;max-width:420px;word-break:break-word;color:#fff;text-shadow:0 2px 6px #000,0 0 3px #000}
/* 1 · подарок: золотая сумма */
.t-classic .nm{color:#fff;text-shadow:0 2px 6px #000,0 0 3px #000}
.t-classic .am{background:linear-gradient(180deg,#fff2b0,#f5b92e 55%,#c9801a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 3px rgba(0,0,0,.7))}
/* 2 · монеты: неоновая подпись сверху */
.t-neon .nm{font-family:Consolas,'Courier New',monospace;text-transform:uppercase;letter-spacing:4px;font-size:23px;color:#fff;text-shadow:0 0 6px #ffd54a,0 0 14px #ffb300,0 2px 4px #000}
.t-neon .am{font-family:Consolas,'Courier New',monospace;color:#ffe27a;text-shadow:0 0 8px #ffb300,0 0 22px #ff9100,0 3px 4px #000}
/* 3 · сердце: мягкий курсив */
.t-minimal .nm{font-weight:600;font-size:25px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 3px #000}
.t-minimal .am{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;color:#ffc2d4;text-shadow:0 0 12px #e0457b,0 3px 6px #000}
/* 4 · мешок: крупные буквы с обводкой */
.t-party .nm{text-transform:uppercase;letter-spacing:1px;color:#fff;-webkit-text-stroke:6px #5a3511;paint-order:stroke fill;text-shadow:0 4px 6px rgba(0,0,0,.5)}
.t-party .am{font-size:50px;color:#ffe066;-webkit-text-stroke:8px #5a3511;paint-order:stroke fill;text-shadow:0 5px 6px rgba(0,0,0,.5)}
/* 5 · серый кот: холодная сталь */
.t-gold .nm{font-family:'Trebuchet MS',Arial,sans-serif;color:#e9eff7;text-shadow:0 2px 0 #3d4a5c,0 4px 8px rgba(0,0,0,.7)}
.t-gold .am{font-family:'Trebuchet MS',Arial,sans-serif;color:#c3d0e0;text-shadow:0 3px 0 #3d4a5c,0 6px 10px rgba(0,0,0,.7)}
/* 6 · панда: пиксельная аркада */
.t-arcade .nm{font-family:'Courier New',Consolas,monospace;text-transform:uppercase;letter-spacing:2px;color:#00e5ff;text-shadow:3px 3px 0 #1a1a5c,0 0 4px #000}
.t-arcade .am{font-family:'Courier New',Consolas,monospace;color:#ffe600;text-shadow:4px 4px 0 #ff3df2,0 0 4px #000}
/* 7 · акула: ледяное свечение */
.t-glass .nm{font-weight:300;letter-spacing:3px;text-transform:uppercase;font-size:24px;color:#fff;text-shadow:0 0 10px #1ea7ff,0 2px 5px #000}
.t-glass .am{font-weight:700;background:linear-gradient(180deg,#fff,#6fd6ff 60%,#1ea7ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(30,167,255,.8)) drop-shadow(0 3px 3px rgba(0,0,0,.6))}
/* 8 · белый котик: круглые конфетные буквы */
.t-candy .nm{font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:900;color:#fff;-webkit-text-stroke:6px #e0357e;paint-order:stroke fill;text-shadow:0 4px 6px rgba(0,0,0,.35)}
.t-candy .am{font-family:'Trebuchet MS','Segoe UI',sans-serif;font-weight:900;font-size:48px;color:#fff;-webkit-text-stroke:8px #ff5d9e;paint-order:stroke fill;text-shadow:0 5px 6px rgba(0,0,0,.35)}
</style></head><body>
<div id="nc" style="display:none;position:fixed;left:10px;top:10px;z-index:9999;background:rgba(0,0,0,.65);color:#fff;font:600 13px/1.3 'Segoe UI',Arial,sans-serif;padding:7px 12px;border-radius:999px">Нет связи с приложением ЭхоЧат — запустите его на этом компьютере</div>
<div id="stage" class="b"></div>
<script>
var PREVIEW=/[?&]preview=1/.test(location.search);
var S={duration:8,scale:100,showMessage:true,design:'classic',textPos:'below',imageV:0};
var DESIGNS=['classic','neon','minimal','party','gold','arcade','glass','candy'];
// шаблон → картинка (1–4 PNG, 5–8 GIF); текст по умолчанию под картинкой, над ней — если так выбрано в приложении (textPos)
var TPL={classic:{n:1},neon:{n:2},minimal:{n:3},party:{n:4},gold:{n:5},arcade:{n:6},glass:{n:7},candy:{n:8}};
function designOf(){return DESIGNS.indexOf(S.design)>=0?S.design:'classic';}
var stage=document.getElementById('stage');
function zoomOf(){return Math.max(40,Math.min(250,+S.scale||100))/100;}
function apply(){
  stage.className=PREVIEW?'m':'b';
  var c=stage.firstChild;if(c&&c.style)c.style.zoom=zoomOf();
}
var BASE='',imgUrl='',imgFor=0;
// своя картинка: берём у приложения один раз на версию и держим в памяти
function loadImage(){
  var v=+S.imageV||0;
  if(!v){if(imgUrl){URL.revokeObjectURL(imgUrl);imgUrl='';}imgFor=0;return Promise.resolve();}
  if(imgFor===v&&imgUrl)return Promise.resolve();
  return fetch(BASE+'/da-image?v='+v,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
    if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=URL.createObjectURL(b);imgFor=v;
  }).catch(function(){if(imgUrl){URL.revokeObjectURL(imgUrl);}imgUrl='';imgFor=v;});
}
var queue=[],busy=false,curCard=null,curT1=0,curT2=0;
function build(d){
  var ds=designOf(),tp=TPL[ds];
  var c=document.createElement('div');c.className='card t-'+ds+(S.textPos==='above'?' at-top':'');
  var a=document.createElement('div');a.className='art';
  var im=document.createElement('img');im.alt='';im.src=imgUrl||(BASE+'/da-tpl/'+tp.n);a.appendChild(im);
  var x=document.createElement('div');x.className='tx';
  var nm=document.createElement('div');nm.className='nm';nm.textContent=d.name||'Аноним';
  var am=document.createElement('div');am.className='am';am.textContent=d.money||'';
  x.appendChild(nm);x.appendChild(am);
  if(S.showMessage&&d.message){var m=document.createElement('div');m.className='ms';m.textContent=d.message;x.appendChild(m);}
  c.style.zoom=zoomOf();c.appendChild(a);c.appendChild(x);
  return {el:c};
}
function show(d){
  loadImage().then(function(){
    var b=build(d),c=b.el;
    stage.innerHTML='';stage.appendChild(c);curCard=c;
    var ms=Math.max(2,+S.duration||8)*1000;
    curT1=setTimeout(function(){c.classList.add('out');curT2=setTimeout(function(){c.remove();curCard=null;busy=false;next();},500);},ms);
  });
}
function next(){if(busy||!queue.length)return;busy=true;show(queue.shift());}
// пробный показ из приложения (выбрали шаблон или картинку) сразу заменяет текущую карточку, а не встаёт в очередь
function add(d){
  if(d.preview){clearTimeout(curT1);clearTimeout(curT2);if(curCard){curCard.remove();curCard=null;}queue=[];busy=false;}
  queue.push(d);if(queue.length>20)queue.shift();next();}
var Q=new URLSearchParams(location.search),FIXED=+Q.get('port')||0;
var REMOTE=!(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&!FIXED);
var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);
var nc=document.getElementById('nc'),ncT=null;
function offline(){if(REMOTE&&!ncT)ncT=setTimeout(function(){nc.style.display='block'},4000);}
function online(){clearTimeout(ncT);ncT=null;nc.style.display='none';}
var told=false;
function tellReady(){if(told)return;told=true;try{if(window.parent&&window.parent!==window)window.parent.postMessage({echochat:'da-ready'},'*');}catch(_){}}
function bind(es){
  es.addEventListener('dasettings',function(e){S=Object.assign(S,JSON.parse(e.data));apply();loadImage();tellReady();});
  es.addEventListener('dadonate',function(e){add(JSON.parse(e.data));});
  es.addEventListener('clear',function(){queue=[];});
}
function connect(){
  if(!REMOTE){BASE='';bind(new EventSource('/events'));return;}
  var i=0;
  (function probe(){
    var port=PORTS[i%PORTS.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,t;
    function fail(){if(got)return;clearTimeout(t);es.close();offline();setTimeout(probe,PORTS.length>1&&i%PORTS.length?30:2500);}
    t=setTimeout(fail,1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);BASE='http://127.0.0.1:'+port;online();}});
    es.onerror=function(){if(got)offline();else fail();};
    es.onopen=function(){if(got)online();};
    bind(es);
  })();
}
apply();connect();
</script></body></html>
