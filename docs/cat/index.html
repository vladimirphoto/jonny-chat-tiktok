<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Котик</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
svg{position:fixed;inset:0;width:100%;height:100%;display:block;overflow:visible}
#nc{position:fixed;left:10px;top:10px;display:none;padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.65);color:#fbbf24;font:13px "Segoe UI",Arial,sans-serif}
.tb{transform-box:fill-box}
/* дыхание: тело плавно «вдыхает», сфера лежит на животе и едет вместе с ним */
#breath{transform-origin:270px 345px;animation:br 4.6s ease-in-out infinite}
#orbit{animation:bob 4.6s ease-in-out infinite}
.awake #breath,.awake #orbit{animation-duration:1.9s}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.4px)}}
#tail{transform-origin:392px 318px;animation:tl 6s ease-in-out infinite}
.awake #tail{animation-duration:1.3s}
@keyframes tl{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(4deg)}}
#hl{transform-origin:150px 380px;transform:translateY(6px) rotate(-3deg);transition:transform 1s ease}.awake #hl{transform:translateY(-8px) rotate(5deg)}
#head{transform-origin:150px 380px;animation:hd 4.6s ease-in-out infinite}
@keyframes hd{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.2deg)}}
.eo{opacity:0;transition:opacity .35s}.ec{opacity:1;transition:opacity .5s}
.awake .eo{opacity:1}.awake .ec{opacity:0}
.mouth-s{opacity:1}.mouth-a{opacity:0}.awake .mouth-s{opacity:0}.awake .mouth-a{opacity:1}
#zz{transition:opacity .6s}.awake #zz{opacity:0}
.z{font:700 22px "Segoe UI",Arial,sans-serif;fill:#cfd8ff;opacity:0;animation:zz 4.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,-22px),var(--dy,-42px)) scale(1.15)}}
.pw{transform-box:fill-box;transform-origin:50% 100%}
.awake #pawA,.awake #pawC{animation:pw 1.1s ease-in-out infinite}.awake #pawB,.awake #pawD{animation:pw 1.1s ease-in-out .4s infinite reverse}
@keyframes pw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.earL,.earR{transform-origin:50% 100%;transform-box:fill-box}
.twitch .earL{animation:et .5s ease-in-out 2}.twitch .earR{animation:et .5s ease-in-out .15s 2 reverse}
@keyframes et{0%,100%{transform:rotate(0)}40%{transform:rotate(-9deg)}}
.wh{transform-origin:100% 50%;transform-box:fill-box;animation:wh 4.6s ease-in-out infinite}
@keyframes wh{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.4deg)}}
#swirl{transform-origin:270px 150px;animation:sw 70s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#glow{opacity:.0;transition:opacity .9s}
/* блики на стекле и вспышка в центре чуть «живут»: плавно покачиваются и мерцают */
#hi1{transform-origin:270px 150px;animation:hi1 8s ease-in-out infinite}
#hi2{transform-origin:270px 150px;animation:hi2 9.5s ease-in-out infinite}
@keyframes hi1{0%,100%{transform:rotate(-6deg) translate(-1px,2px);opacity:.75}50%{transform:rotate(7deg) translate(3px,-2px);opacity:1}}
@keyframes hi2{0%,100%{transform:rotate(5deg);opacity:.6}50%{transform:rotate(-7deg);opacity:1}}
#core{transform-box:fill-box;transform-origin:50% 50%;animation:cp 5.5s ease-in-out infinite}
@keyframes cp{0%,100%{transform:scale(.96);opacity:.88}50%{transform:scale(1.09);opacity:1}}
#flare{transform-origin:258px 138px;animation:fl 11s ease-in-out infinite}
@keyframes fl{0%,100%{transform:rotate(-4deg);opacity:.8}50%{transform:rotate(5deg);opacity:1}}
.flash #glow{opacity:1;transition:opacity .15s}
.gi{opacity:0}
.gi.in{animation:pin .9s cubic-bezier(.2,1.5,.4,1) forwards}
.gi.out{animation:pout .9s ease-in forwards}
@keyframes pin{0%{opacity:0;transform:scale(0) rotate(-40deg)}55%{opacity:1;transform:scale(1.5) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pout{to{opacity:0;transform:scale(.2) rotate(30deg)}}
.gb{animation:gb 3.4s ease-in-out infinite}
@keyframes gb{0%,100%{transform:translateY(-2.5px)}50%{transform:translateY(2.5px)}}
.burst{fill:none;stroke:#fff;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.burst.go{animation:bs .9s ease-out forwards}
@keyframes bs{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
.spk{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.spk.go{animation:sp 1s ease-out forwards}
@keyframes sp{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
</style></head><body>

<script>

var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);

function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
// псевдослучайные числа с фиксированным зерном: шерсть выглядит одинаково при каждой загрузке
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}
function fur(g,x0,y0,x1,y1,n,cols,len,ang){
  for(var i=0;i<n;i++){var x=x0+rnd()*(x1-x0),y=y0+rnd()*(y1-y0),a=(ang(x,y)+(rnd()-.5)*.9),l=len*(.5+rnd()),c=cols[Math.floor(rnd()*cols.length)];
    el('path',{d:'M'+x.toFixed(1)+' '+y.toFixed(1)+'q'+(Math.cos(a+.5)*l*.5).toFixed(1)+' '+(Math.sin(a+.5)*l*.5).toFixed(1)+' '+(Math.cos(a)*l).toFixed(1)+' '+(Math.sin(a)*l).toFixed(1),stroke:c,'stroke-width':(.6+rnd()*1.1).toFixed(2),'stroke-linecap':'round',fill:'none',opacity:(.25+rnd()*.5).toFixed(2)},g);}
}
fur($('furBody'),90,240,450,400,560,['#c9b3c3','#1f1822','#f2a44e','#e8d2bd','#7b6678','#3a2f3c'],11,function(x,y){return -1.2+(x-90)*.004;});
fur($('furTail'),370,180,470,340,170,['#a58ba5','#201826','#ff8fd8','#6c566c','#3a2d3d'],9,function(x,y){return -1.2+(y-250)*.004;});
fur($('furHead'),30,260,176,384,150,['#d3bfcd','#1f1822','#f2a44e','#efdcc6','#8a7488'],7,function(x,y){return Math.atan2(y-330,x-102)+.2;});

// ---- шерсть по контуру: пучки растут из края фигуры наружу (лежат под фигурой), силуэт становится мягким и пушистым ----
// Пучки не торчат иглами: каждый наклонён вдоль контура в сторону «лежания» шерсти (o.dir), изогнут и сужается к кончику.
function f1(v){return v.toFixed(1);}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function edge(path,s,L,o){
  var p=path.getPointAtLength(s%L),q=path.getPointAtLength((s+2)%L);
  var tx=q.x-p.x,ty=q.y-p.y,tl=Math.sqrt(tx*tx+ty*ty)||1;tx/=tl;ty/=tl;
  var nx=ty,ny=-tx;
  if(path.isPointInFill(new DOMPoint(p.x+nx*3,p.y+ny*3))){nx=-nx;ny=-ny;}
  var d=o.dir?o.dir(p.x,p.y):[0,1];
  if(tx*d[0]+ty*d[1]<0){tx=-tx;ty=-ty;}
  return {p:p,tx:tx,ty:ty,nx:nx,ny:ny};
}
function outlineFur(path,o){
  var parent=path.parentNode,L=path.getTotalLength(),n=o.n,B={},i,k,nw=o.nw==null?.6:o.nw;
  for(i=0;i<n;i++){
    var e=edge(path,(i+rnd()*.9)/n*L,L,o),p=e.p,tx=e.tx,ty=e.ty,nx=e.nx,ny=e.ny;
    var len=o.len[0]+rnd()*(o.len[1]-o.len[0]);if(o.lf)len*=o.lf(p.x,p.y);
    if(len<1.5)continue;
    var fl=(o.flow==null?1:o.flow)*(.35+rnd()*.65),dx=nx*nw+tx*fl,dy=ny*nw+ty*fl,dl=Math.sqrt(dx*dx+dy*dy)||1;dx/=dl;dy/=dl;
    var bx=p.x-nx*3,by=p.y-ny*3,tipx=p.x+dx*len,tipy=p.y+dy*len;
    var w=(o.w||2.4)*(.75+rnd()*.6),bend=(.25+rnd()*.5)*len*.45;
    var mx=(bx+tipx)/2,my=(by+tipy)/2,px=-dy,py=dx;
    var c1x=mx+px*(w*.9+bend),c1y=my+py*(w*.9+bend),c2x=mx+px*(-w*.9+bend),c2y=my+py*(-w*.9+bend);
    var col=o.col(p.x,p.y),op=rnd()<.5?.96:.8,key=col+'|'+op;
    (B[key]=B[key]||[]).push('M'+f1(bx+tx*w)+' '+f1(by+ty*w)+'Q'+f1(c1x)+' '+f1(c1y)+' '+f1(tipx)+' '+f1(tipy)+'Q'+f1(c2x)+' '+f1(c2y)+' '+f1(bx-tx*w)+' '+f1(by-ty*w)+'Z');
  }
  var g=el('g',{});
  for(k in B){var kk=k.split('|');el('path',{d:B[k].join(''),fill:kk[0],opacity:kk[1]},g);}
  parent.insertBefore(g,path);
  return g;
}
// тонкие светлые волоски поверх края: подсветка контура, чтобы шерсть блестела, а не сливалась в пятно
function rimHairs(path,o){
  var parent=path.parentNode,L=path.getTotalLength(),n=o.n,B={},i,k,nw=o.nw==null?.6:o.nw;
  for(i=0;i<n;i++){
    var e=edge(path,(i+rnd()*.9)/n*L,L,o),p=e.p,tx=e.tx,ty=e.ty,nx=e.nx,ny=e.ny;
    var len=o.len[0]+rnd()*(o.len[1]-o.len[0]);if(o.lf)len*=o.lf(p.x,p.y);
    if(len<1.5)continue;
    var fl=(o.flow==null?1:o.flow)*(.35+rnd()*.65),dx=nx*nw+tx*fl,dy=ny*nw+ty*fl,dl=Math.sqrt(dx*dx+dy*dy)||1;dx/=dl;dy/=dl;
    var bx=p.x-nx*len*.3,by=p.y-ny*len*.3,tipx=p.x+dx*len*.75,tipy=p.y+dy*len*.75,bend=(rnd()-.2)*len*.4;
    var col=o.col(p.x,p.y);
    (B[col]=B[col]||[]).push('M'+f1(bx)+' '+f1(by)+'Q'+f1((bx+tipx)/2-dy*bend)+' '+f1((by+tipy)/2+dx*bend)+' '+f1(tipx)+' '+f1(tipy));
  }
  var g=el('g',{fill:'none','stroke-linecap':'round','stroke-width':o.sw||.9,opacity:o.op||.5});
  for(k in B)el('path',{d:B[k].join(''),stroke:k},g);
  parent.insertBefore(g,path.nextSibling);
  return g;
}
var P={belly:['#f0dcc4','#e8d2bd','#cdb59f','#bfa58f'],org:['#f2a44e','#d9822f','#c46f22','#e8903a'],dk:['#5d4d5c','#7b6678','#3d3140','#2c242f','#6a5668'],
  tail:['#3b3040','#4a3b4e','#6f5a6f','#a58ba5','#201826','#8a738a'],pawF:['#f6e8d6','#e6cfb8','#fff4e6','#d4bba4'],pawH:['#9a8798','#5a4a5a','#3d3040','#b8a5b6'],
  earL:['#403443','#5d4d5c','#6c5a6c'],earR:['#d9822f','#f2a44e','#b86a22'],cream:['#fff4e6','#f0e0cb','#e6cfb8','#ffffff']};
function inEll(x,y,cx,cy,rx,ry,k){var a=(x-cx)/rx,b=(y-cy)/ry;return a*a+b*b<k*k;}
function bodyCol(x,y){
  if(inEll(x,y,190,360,110,40,1.35)&&x<300)return pick(P.belly);
  if(inEll(x,y,330,292,96,38,1.5)||inEll(x,y,400,352,46,36,1.5))return pick(P.org);
  return pick(P.dk);
}
function headCol(x,y){
  if(y>338&&Math.abs(x-102)<44)return pick(P.belly);
  if(x>104&&y<322)return pick(P.org);
  return pick(P.dk);
}
try{
  var bodyP=$('bodyShape'),headP=$('headBase'),tailP=$('tailBase');
  var floorLf=function(x,y){return y>388?.28:1;};
  outlineFur(bodyP,{n:560,len:[7,13],w:2.5,flow:1,nw:.6,col:bodyCol,lf:floorLf,dir:function(){return[1,.35];}});
  rimHairs(bodyP,{n:340,len:[7,13],flow:1,nw:.6,col:bodyCol,lf:floorLf,sw:.9,op:.5,dir:function(){return[1,.35];}});
  outlineFur(tailP,{n:230,len:[7,13],w:2.3,flow:1.1,nw:.55,col:function(){return pick(P.tail);},lf:function(x,y){return y<205?1.5:1;},dir:function(){return[.3,-1];}});
  rimHairs(tailP,{n:170,len:[8,14],flow:1.1,nw:.55,col:function(){return pick(['#a58ba5','#c9b3c3','#8a738a','#ffb8e6']);},sw:.9,op:.4,dir:function(){return[.3,-1];}});
  var hl=function(x,y){return(y<292?.8:1)+Math.max(0,(y-312)/60)*.6+Math.abs(x-102)/62*.25;};
  outlineFur(headP,{n:280,len:[6,12],w:2.3,flow:1,nw:.62,col:headCol,lf:hl,dir:function(x,y){return[x<102?-.4:.4,1];}});
  rimHairs(headP,{n:200,len:[7,12],flow:1,nw:.62,col:headCol,lf:hl,sw:.9,op:.45,dir:function(x,y){return[x<102?-.4:.4,1];}});
  outlineFur($('muzzle'),{n:80,len:[3,6.5],w:1.7,flow:.9,nw:.6,col:function(){return pick(P.cream);},dir:function(x){return[x<104?-1:1,.6];}});
  outlineFur($('earLp'),{n:36,len:[3.5,8],w:1.7,flow:1,nw:.6,col:function(){return pick(P.earL);},dir:function(){return[0,-1];}});
  outlineFur($('earRp'),{n:36,len:[3.5,8],w:1.7,flow:1,nw:.6,col:function(){return pick(P.earR);},dir:function(){return[0,-1];}});
  fur($('furEarL'),58,246,88,272,16,['#fff4e6','#ffe0e8','#ffffff'],7,function(){return -1.55+(rnd()-.5)*.5;});
  fur($('furEarR'),58,246,88,272,16,['#fff4e6','#ffe0e8','#ffffff'],7,function(){return -1.55+(rnd()-.5)*.5;});
  outlineFur($('pawF').firstElementChild,{n:84,len:[3,6.5],w:1.9,flow:1,nw:.6,col:function(){return pick(P.pawF);},dir:function(x){return[x<0?-1:1,.8];}});
  outlineFur($('pawH').firstElementChild,{n:84,len:[3,6.5],w:1.9,flow:1,nw:.6,col:function(){return pick(P.pawH);},dir:function(x){return[x<0?-1:1,.8];}});
}catch(e){}
// звёзды в сфере
(function(){var g=$('stars');for(var i=0;i<70;i++){var a=rnd()*6.283,r=Math.sqrt(rnd())*112,x=270+Math.cos(a)*r,y=150+Math.sin(a)*r,s=.5+rnd()*1.5,c=el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:s.toFixed(2),fill:['#fff','#cfe6ff','#ffd6f1'][i%3],'class':'st'},g);c.style.animationDelay=(rnd()*3).toFixed(2)+'s';c.style.animationDuration=(2+rnd()*3).toFixed(1)+'s';}})();

// ---- подарки по кругу ----
var SLOTS=10,CX=270,CY=150,R=90,LIFE=150000,slots=[],next=0;
var EMOJI=['🌹','🍩','❤️','🎁','⭐','🍭','🧸','💎','🌸','🍓','🫶','🍰'];
function slotPos(i){var a=(-90+i*360/SLOTS)*Math.PI/180;return[CX+Math.cos(a)*R,CY+Math.sin(a)*R];}
function burst(x,y){
  var b=el('circle',{cx:x,cy:y,r:22,'class':'burst'},fx);b.getBoundingClientRect();b.classList.add('go');setTimeout(function(){b.remove();},950);
  for(var i=0;i<8;i++){var a=i*.785+Math.random()*.4,d=34+Math.random()*16,s=el('path',{d:'M0-5L1.4-1.4L5 0L1.4 1.4L0 5L-1.4 1.4L-5 0L-1.4-1.4Z',fill:['#fff','#ffd6f1','#bff6ff'][i%3],transform:'translate('+x+' '+y+')','class':'spk'},fx);
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.getBoundingClientRect();s.classList.add('go');(function(q){setTimeout(function(){q.remove();},1050);})(s);}
}
function hide(it){if(!it)return;clearTimeout(it.t);it.g.classList.remove('in');it.g.classList.add('out');var g=it.wrap||it.g;setTimeout(function(){g.remove();},950);}
function addGift(d){
  var i=next%SLOTS;next++;hide(slots[i]);
  var p=slotPos(i),g=el('g',{'class':'gi tb',transform:'translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')'},ring);
  var box=el('g',{'class':'gi in tb'},g);g.setAttribute('class','');box.style.transformBox='fill-box';box.style.transformOrigin='50% 50%';
  var bob=el('g',{'class':'gb tb'},box);bob.style.animationDelay=(-Math.random()*3).toFixed(2)+'s';
  el('circle',{r:27,fill:'url(#gGift)'},bob);
  var inner=el('g',{filter:'url(#gsh)'},bob);
  if(d.image&&/^(https?:|data:|\/)/.test(d.image)){var im=el('image',{x:-21,y:-21,width:42,height:42,preserveAspectRatio:'xMidYMid meet'},inner);im.setAttributeNS('http://www.w3.org/1999/xlink','href',d.image);im.setAttribute('href',d.image);
    im.addEventListener('error',function(){inner.removeChild(im);emo(inner,d);});}
  else emo(inner,d);
  var it={g:box,wrap:g};slots[i]=it;it.t=setTimeout(function(){hide(it);},LIFE);burst(p[0],p[1]);wake();
}
function emo(p,d){var t=el('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':36,x:0,y:2},p);t.textContent=d.emoji||EMOJI[(next-1)%EMOJI.length];}
// ---- кот просыпается от подарка и снова засыпает ----
var sleepT=null;
function wake(){sc.classList.add('awake','flash','twitch');clearTimeout(sleepT);setTimeout(function(){sc.classList.remove('flash');},650);setTimeout(function(){sc.classList.remove('twitch');},1500);sleepT=setTimeout(function(){sc.classList.remove('awake');},6500);}
function clearAll(){slots.forEach(hide);slots=[];}

// ---- связь с приложением ----
var told=false,nc=$('nc');
var SHOWMSG=window.parent!==window||Q.has('debug');
function tellReady(){if(told)return;told=true;try{if(window.parent&&window.parent!==window)window.parent.postMessage({echochat:'cat-ready'},'*');}catch(_){}}
function online(){nc.style.display='none';}function offline(){if(SHOWMSG)nc.style.display='block';}
function bind(es){
  es.addEventListener('catsettings',function(){tellReady();});
  es.addEventListener('catgift',function(e){try{addGift(JSON.parse(e.data));}catch(_){}});
  es.addEventListener('catclear',function(){clearAll();});
  es.addEventListener('clear',function(){clearAll();});
}
function connect(){
  if(!REMOTE){bind(new EventSource('/events'));return;}
  var r=PORTS.length>1?Math.floor(Math.random()*Math.min(5,PORTS.length)):0,order=PORTS.slice(r).concat(PORTS.slice(0,r)),i=0;
  (function probe(){
    var port=order[i%order.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,dead=false,t,rt=null;
    function again(){if(dead)return;dead=true;clearTimeout(t);clearTimeout(rt);es.close();offline();setTimeout(probe,order.length>1&&i%order.length?30:2500);}
    t=setTimeout(function(){if(!got)again();},1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);online();}});
    es.onerror=function(){if(!got){again();return;}offline();if(!rt)rt=setTimeout(function(){i=0;again();},6000);};
    es.onopen=function(){if(got){online();clearTimeout(rt);rt=null;}};
    bind(es);
  })();
}
if(Q.has('demo')){setTimeout(function(){['🌹','🍩','❤️','🎁','🌹','🍩','⭐'].forEach(function(e,k){setTimeout(function(){addGift({emoji:e});},k*500);});},400);}
else connect();
