<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Донаты</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;height:100%}
#stage{position:fixed;inset:0;display:flex;padding:18px;box-sizing:border-box}
#stage.l{justify-content:flex-start}#stage.c{justify-content:center}#stage.r{justify-content:flex-end}
#stage.t{align-items:flex-start}#stage.m{align-items:center}#stage.b{align-items:flex-end}
.cw{position:relative}
.card{position:relative;isolation:isolate;display:flex;align-items:center;gap:18px;min-width:320px;max-width:560px;padding:16px 30px 16px 18px;color:#fff;box-sizing:border-box;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.card.out{animation:bye .45s ease-in both}
.art{position:relative;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:54px;line-height:1;
 background:color-mix(in srgb,var(--ac,#8b5cf6) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac,#8b5cf6) 50%,transparent);
 font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:bob 1.8s ease-in-out infinite}
.card .art.img{background:none!important;box-shadow:none!important;border-radius:0!important;animation:none!important;font-size:0}
.art.img img{display:block;width:100%;height:100%;object-fit:contain}
.tx{position:relative;min-width:0}
.nm{font-size:30px;font-weight:800;line-height:1.15;word-break:break-word}
.am{margin-top:2px;font-size:40px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.ms{margin-top:6px;font-size:19px;line-height:1.3;color:rgba(255,255,255,.9);word-break:break-word}
.sp{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#c4b5fd;opacity:0;animation:spark 1.1s ease-out both;pointer-events:none}
/* ---- четыре фирменных оформления (S.design): Аврора, Эквалайзер, Кристалл, Орбита ---- */
/* Аврора: тёмное стекло, по рамке бежит фиолетово-розовый свет */
.d-aurora{border-radius:30px;overflow:hidden;background:linear-gradient(135deg,rgba(139,92,246,.5),rgba(236,72,153,.4));box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 44px rgba(139,92,246,.32)}
.d-aurora::before{content:"";position:absolute;z-index:-2;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:conic-gradient(from 0deg,transparent 0 52%,#8b5cf6 68%,#ec4899 84%,#fff 90%,transparent 94%);animation:spin 4.5s linear infinite}
.d-aurora::after{content:"";position:absolute;z-index:-1;inset:2px;border-radius:28px;background:radial-gradient(120% 140% at 0% 0%,rgba(139,92,246,.28),transparent 55%),linear-gradient(150deg,#15122b,#0a0a14)}
.d-aurora .am{background:linear-gradient(90deg,#fff 35%,#fbcfe8 70%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.d-aurora .sp{background:#c4b5fd;box-shadow:0 0 10px #a78bfa}
/* Эквалайзер: столбики из логотипа приложения качаются сбоку */
.d-eq{padding-right:98px;border-radius:20px;background:linear-gradient(135deg,#16122e,#0a0a14);border:1px solid rgba(139,92,246,.45);box-shadow:0 18px 46px rgba(0,0,0,.55),0 0 34px rgba(139,92,246,.22),inset 0 1px 0 rgba(255,255,255,.08);animation:slide .5s cubic-bezier(.2,.9,.3,1) both}
.d-eq .art{border-radius:20px}
.d-eq .am{background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.d-eq .sp{background:#f472b6;box-shadow:0 0 10px #ec4899}
.eqb{position:absolute;right:28px;top:50%;height:52px;margin-top:-26px;display:flex;align-items:flex-end;gap:5px}
.eqb i{display:block;width:7px;height:100%;border-radius:4px;background:linear-gradient(0deg,#8b5cf6,#ec4899);transform-origin:50% 100%;animation:eq 1s ease-in-out infinite}
.eqb i:nth-child(2){animation-duration:.78s;animation-delay:-.25s}.eqb i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s}.eqb i:nth-child(4){animation-duration:.9s;animation-delay:-.4s}.eqb i:nth-child(5){animation-duration:1.05s;animation-delay:-.1s}
/* Кристалл: срезанные углы и голографическая фольга со скользящим бликом */
.cw-crystal{filter:drop-shadow(0 0 16px rgba(139,92,246,.5)) drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.d-crystal{--cut:26px;padding:18px 42px 18px 24px;background:linear-gradient(115deg,#22d3ee,#8b5cf6 38%,#ec4899 68%,#22d3ee);background-size:300% 100%;
 clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));animation:cut .6s cubic-bezier(.2,.9,.3,1) both,holo 7s linear infinite}
.d-crystal::before{content:"";position:absolute;z-index:-1;inset:2px;clip-path:polygon(calc(var(--cut) - 1px) 0,100% 0,100% calc(100% - var(--cut) + 1px),calc(100% - var(--cut) + 1px) 100%,0 100%,0 calc(var(--cut) - 1px));
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 12px),linear-gradient(160deg,#18142f,#0a0a15)}
.d-crystal::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:30%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:shine 3.2s ease-in-out .6s infinite}
.d-crystal .art{border-radius:0;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);box-shadow:none;background:color-mix(in srgb,var(--ac,#8b5cf6) 22%,#12102a)}
.d-crystal .nm{font-style:italic;letter-spacing:.6px}
.d-crystal .am{font-style:italic;background:linear-gradient(90deg,#67e8f9,#e9d5ff 55%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.d-crystal .sp{width:11px;height:11px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#67e8f9}
/* Орбита: матовая капсула, вокруг значка крутится светящееся кольцо */
.d-orbit{padding:12px 40px 12px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(14,12,26,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.d-orbit .art{margin:8px;background:rgba(255,255,255,.08);box-shadow:none}
.d-orbit .art::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2.5px solid transparent;border-top-color:#ec4899;border-right-color:#a78bfa;filter:drop-shadow(0 0 6px rgba(236,72,153,.8));animation:spin 2.2s linear infinite}
.d-orbit .art::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.13)}
.d-orbit .art.img::before,.d-orbit .art.img::after{display:none}
.d-orbit .nm{font-weight:700}
.d-orbit .am{color:#fff;text-shadow:0 0 20px rgba(236,72,153,.75)}
.d-orbit .sp{background:#fff;box-shadow:0 0 10px #c4b5fd}
/* ---- раскладка «картинка сверху, имя и сумма снизу» (S.layout = top), как у DonationAlerts ---- */
.card.v-top{flex-direction:column;align-items:center;text-align:center;gap:12px;min-width:300px;max-width:520px;padding:22px 34px 22px}
.card.v-top .art{width:150px;height:150px;font-size:88px}
.card.v-top .tx{width:100%}
.card.v-top .nm{font-size:32px}
.card.v-top .am{font-size:44px}
.card.v-top.d-eq{padding:22px 34px 18px}
.card.v-top.d-eq .eqb{position:static;height:34px;margin:8px auto 0;transform:none}
.card.v-top.d-crystal{padding:24px 40px 24px}
.card.v-top.d-orbit{border-radius:48px;padding:24px 38px 24px}
.card.v-top.d-orbit .art{margin:10px 10px 6px}
.card.v-top.d-aurora{border-radius:32px}
/* своя картинка (S.imageV): на экране только она — без рамки, фона, обводок и теней карточки; имя и сумма остаются в стиле выбранного оформления.
   Фона у карточки нет, поэтому тексту добавлены тени для читаемости на любом кадре */
.card.bare{background:none!important;border:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:0!important;clip-path:none!important;overflow:visible!important}
.card.bare::before,.card.bare::after,.card.bare .eqb{display:none!important}
.card.bare.d-eq,.card.bare.d-crystal{padding:16px 30px 16px 18px}
.card.bare.v-top{padding:22px 34px}
.card.bare .nm,.card.bare .ms{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 9px rgba(0,0,0,.7)}
.card.bare .am{text-shadow:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.85)) drop-shadow(0 0 12px rgba(139,92,246,.6))}
.card.bare.d-orbit .am{text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 18px rgba(236,72,153,.7);filter:none}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.82)}to{opacity:1;transform:none}}
@keyframes bye{to{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.4)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes holo{to{background-position:-300% 0}}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@keyframes slide{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes cut{from{opacity:0;transform:translateX(34px) skewX(-10deg)}to{opacity:1;transform:none}}
</style></head><body>
<div id="nc" style="display:none;position:fixed;left:10px;top:10px;z-index:9999;background:rgba(0,0,0,.65);color:#fff;font:600 13px/1.3 'Segoe UI',Arial,sans-serif;padding:7px 12px;border-radius:999px">Нет связи с приложением ЭхоЧат — запустите его на этом компьютере</div>
<div id="stage" class="c b"></div>
<script>
var PREVIEW=/[?&]preview=1/.test(location.search);
var S={duration:8,scale:100,align:'center',vpos:'bottom',showMessage:true,design:'aurora',layout:'top'};
var DESIGNS=['aurora','eq','crystal','orbit'];
var DCLS={aurora:'d-aurora',eq:'d-eq',crystal:'d-crystal',orbit:'d-orbit'};
function designOf(){return DESIGNS.indexOf(S.design)>=0?S.design:'aurora';}
var stage=document.getElementById('stage');
// картинка в тему суммы (в тенге)
var TIERS=[
 {max:500,art:'\u2615',cap:'Кофе',ac:'#f59e0b'},
 {max:2000,art:'\ud83c\udf55',cap:'Пицца',ac:'#fb7185'},
 {max:5000,art:'\ud83c\udf81',cap:'Подарок',ac:'#f14635'},
 {max:10000,art:'\ud83d\udc8e',cap:'Бриллиант',ac:'#22d3ee'},
 {max:Infinity,art:'\ud83d\ude80',cap:'Ракета',ac:'#a78bfa'}
];
function tierOf(a){for(var i=0;i<TIERS.length;i++)if(a<TIERS[i].max)return TIERS[i];return TIERS[TIERS.length-1];}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0')+'\u00a0\u20b8';}
function zoomOf(){return Math.max(40,Math.min(250,+S.scale||100))/100;}
function apply(){
  stage.className=PREVIEW?'c m':({left:'l',center:'c',right:'r'}[S.align]||'c')+' '+({top:'t',center:'m',bottom:'b'}[S.vpos]||'b');
  var c=stage.firstChild;
  if(c&&c.style){
    var z=zoomOf();
    // только в предпросмотре: карточка (особенно «картинка сверху») подгоняется под рамку, чтобы не выходить за поля
    if(PREVIEW){c.style.zoom=1;var h=c.offsetHeight||1,w=c.offsetWidth||1,fit=Math.min((window.innerHeight-16)/h,(window.innerWidth-16)/w);if(fit>0&&fit<z)z=fit;}
    c.style.zoom=z;
  }
}
if(PREVIEW)window.addEventListener('resize',function(){apply();});
var BASE='',imgUrl='',imgFor=0;
// своя картинка: берём у приложения один раз на версию и держим в памяти
function loadImage(){
  var v=+S.imageV||0;
  if(!v){if(imgUrl){URL.revokeObjectURL(imgUrl);imgUrl='';}imgFor=0;return Promise.resolve();}
  if(imgFor===v&&imgUrl)return Promise.resolve();
  return fetch(BASE+'/donate-image?v='+v,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
    if(imgUrl)URL.revokeObjectURL(imgUrl);imgUrl=URL.createObjectURL(b);imgFor=v;
  }).catch(function(){if(imgUrl){URL.revokeObjectURL(imgUrl);}imgUrl='';imgFor=v;});
}
var PL={classic:{f:'classic',w:650,h:238,av:[144, 150, 68, 'c'],nm:[272, 96, 486, 146],sb:[262, 162, 560, 200],ac:'#e66bff'},heart:{f:'heart',w:659,h:234,av:null,nm:[256, 86, 470, 140],sb:[258, 150, 568, 196],ac:'#b77bff'},gold:{f:'gold',w:684,h:237,av:[149, 131, 53, 'c'],nm:[296, 82, 512, 132],sb:[296, 132, 596, 190],ac:'#ffb703'},cyan:{f:'cyan',w:676,h:206,av:[131, 106, 56, 'c'],nm:[248, 64, 436, 108],sb:[250, 112, 528, 152],ac:'#22b8ff'},goldoval:{f:'goldoval',w:678,h:231,av:[144, 135, 62, 'c'],nm:[272, 80, 498, 129],sb:[278, 136, 572, 180],ac:'#ffc531'},paper:{f:'paper',w:692,h:209,av:[141, 113, 46, 's'],nm:[252, 58, 450, 108],sb:[260, 114, 540, 160],ac:'#b25cff'},pink:{f:'pink',w:643,h:237,av:[137, 123, 62, 'c'],nm:[296, 80, 494, 128],sb:[296, 134, 586, 178],ac:'#ff4f93'},cat:{f:'cat',w:658,h:278,av:[117, 185, 60, 'c'],nm:[258, 140, 458, 190],sb:[258, 198, 538, 240],ac:'#b878ff'}};
var queue=[],busy=false;
function eqBars(){var e=document.createElement('div');e.className='eqb';e.innerHTML='<i></i><i></i><i></i><i></i><i></i>';return e;}
function sparks(box){ // искры разлетаются от плашки; лежат в обёртке, чтобы срезанные углы и скругления их не обрезали
  for(var i=0;i<14;i++){var s=document.createElement('i');s.className='sp';var a=Math.random()*6.283,d=90+Math.random()*110;
    s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=(Math.random()*.25)+'s';box.appendChild(s);}
}
function show(d){
  var t=tierOf(+d.amount||0),ds=designOf();
  var w=document.createElement('div');w.className='cw'+(imgUrl?'':' cw-'+ds);
  var c=document.createElement('div');c.className='card '+DCLS[ds]+(S.layout==='side'?'':' v-top');c.style.setProperty('--ac',t.ac);
  var a=document.createElement('div');a.className='art';
  if(imgUrl){a.className='art img';c.classList.add('bare');var im=document.createElement('img');im.alt='';im.src=imgUrl;a.appendChild(im);}else a.textContent=t.art;
  var x=document.createElement('div');x.className='tx';
  var nm=document.createElement('div');nm.className='nm';nm.textContent=d.name||'Аноним';
  var am=document.createElement('div');am.className='am';am.textContent=fmt(+d.amount||0);
  x.appendChild(nm);x.appendChild(am);
  if(S.showMessage&&d.message){var m=document.createElement('div');m.className='ms';m.textContent=d.message;x.appendChild(m);}
  c.appendChild(a);c.appendChild(x);
  if(ds==='eq')c.appendChild(eqBars());
  w.appendChild(c);stage.innerHTML='';stage.appendChild(w);apply();
  sparks(w);
  var ms=Math.max(2,+S.duration||8)*1000;
  setTimeout(function(){c.classList.add('out');setTimeout(function(){w.remove();busy=false;next();},500);},ms);
}
function next(){if(busy||!queue.length)return;busy=true;loadImage().then(function(){var d=queue.shift();if(!d){busy=false;return;}show(d);});}
function add(d){queue.push(d);if(queue.length>20)queue.shift();next();}
var Q=new URLSearchParams(location.search),FIXED=+Q.get('port')||0;
var REMOTE=!(/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&!FIXED);
var PORTS=[];if(FIXED)PORTS=[FIXED];else for(var pp=7878;pp<=7898;pp++)PORTS.push(pp);
var nc=document.getElementById('nc'),ncT=null;
function offline(){if(REMOTE&&!ncT)ncT=setTimeout(function(){nc.style.display='block'},4000);}
function online(){clearTimeout(ncT);ncT=null;nc.style.display='none';}
var told=false;
function tellReady(){if(told)return;told=true;try{if(window.parent&&window.parent!==window)window.parent.postMessage({echochat:'donate-ready'},'*');}catch(_){}}
function bind(es){
  es.addEventListener('dsettings',function(e){S=Object.assign(S,JSON.parse(e.data));apply();tellReady();});
  es.addEventListener('donate',function(e){add(JSON.parse(e.data));});
  es.addEventListener('clear',function(){queue=[];});
}
function connect(){
  if(!REMOTE){bind(new EventSource('/events'));return;}
  // приложение слушает несколько соседних портов, а у браузера предел 6 потоков на порт, поэтому каждая страница начинает с случайного из первых пяти
  var r=PORTS.length>1?Math.floor(Math.random()*Math.min(5,PORTS.length)):0,order=PORTS.slice(r).concat(PORTS.slice(0,r)),i=0;
  (function probe(){
    var port=order[i%order.length];i++;
    var es=new EventSource('http://127.0.0.1:'+port+'/events'),got=false,dead=false,t,rt=null;
    function again(){if(dead)return;dead=true;clearTimeout(t);clearTimeout(rt);es.close();offline();setTimeout(probe,order.length>1&&i%order.length?30:2500);}
    t=setTimeout(function(){if(!got)again();},1500);
    es.addEventListener('settings',function(){if(!got){got=true;clearTimeout(t);BASE='http://127.0.0.1:'+port;online();}});
    // связь оборвалась уже после подключения: браузер сам пробует тот же адрес, но если приложение перезапустилось на другом порту, он не найдёт его никогда.
    // Поэтому через 6 секунд без связи закрываем поток и ищем приложение заново по всем портам
    es.onerror=function(){if(!got){again();return;}offline();if(!rt)rt=setTimeout(function(){i=0;again();},6000);};
    es.onopen=function(){if(got){online();clearTimeout(rt);rt=null;}};
    bind(es);
  })();
}
apply();connect();
</script></body></html>
